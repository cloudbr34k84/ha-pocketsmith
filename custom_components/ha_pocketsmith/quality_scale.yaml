# Internal custom/HACS checklist; not an official Home Assistant tier award.
rules:
  action-exceptions:
    status: done
    comment: >-
      Actions validate state and check coordinator refresh success; buttons use the same service handlers.
  config-entry-unloading:
    status: done
    comment: >-
      Unloads platforms, cancels and awaits historical backfill; coordinator handles its own shutdown.
  action-setup:
    status: done
    comment: >-
      Actions are registered in async_setup and validate loaded entries before use.
  appropriate-polling:
    status: done
    comment: >-
      Hourly coordinator polling; no interval form or number control.
  brands:
    status: done
    comment: >-
      Custom integration scope: local PNG icons and logos on HA 2026.3+; not an official Core award.
  common-modules:
    status: done
    comment: >-
      Coordinator is in coordinator.py; no integration base entity class.
  config-flow:
    status: done
    comment: >-
      UI setup, password selectors, field descriptions, connection data and options separated.
  docs-configuration-parameters:
    status: done
    comment: >-
      README documents the historical backfill option and default.
  docs-installation-parameters:
    status: done
    comment: >-
      README documents the developer API key and required permissions.
  config-flow-test-coverage:
    status: done
    comment: >-
      User, duplicate, reauth, reconfigure, options and error recovery tests; CI requires 100% line and branch coverage.
  docs-actions:
    status: done
    comment: >-
      README and services describe all actions, fields, response and reset prerequisites.
  docs-high-level-description:
    status: done
    comment: >-
      README Overview describes and links PocketSmith.
  docs-installation-instructions:
    status: done
    comment: >-
      README has prerequisites and HACS/manual/UI instructions; minimum matches hacs.json.
  docs-removal-instructions:
    status: done
    comment: >-
      README documents entry removal, API key revocation, files and retained data.
  entity-event-setup:
    status: done
    comment: >-
      CoordinatorEntity handles listener subscription and removal.
  entity-unique-id:
    status: done
    comment: >-
      Immutable account/category IDs; existing registry entries migrate without changing entity_id.
  entity-unavailable:
    status: done
    comment: >-
      CoordinatorEntity propagates coordinator failures to entity availability.
  has-entity-name:
    status: done
    comment: >-
      Every entity sets has_entity_name.
  integration-owner:
    status: done
    comment: >-
      manifest.json declares the integration owner.
  log-when-unavailable:
    status: done
    comment: >-
      Coordinator handles polling transitions; backfill logs outage/recovery once and retry details at debug level.
  parallel-updates:
    status: done
    comment: >-
      Every entity platform explicitly sets PARALLEL_UPDATES = 0.
  reauthentication-flow:
    status: done
    comment: >-
      The UI reauthentication flow validates and replaces revoked API keys.
  runtime-data:
    status: done
    comment: >-
      Typed config entry stores coordinator and backfill in runtime_data.
  test-before-configure:
    status: done
    comment: >-
      Real me request before entry creation; failures return actionable form errors.
  test-before-setup:
    status: done
    comment: >-
      First refresh gates setup; 401/403 require reauthentication, transient errors retry without duplicate logging.
  test-coverage:
    status: done
    comment: >-
      CI requires 100% line and branch coverage for every integration module.
  unique-config-entry:
    status: done
    comment: >-
      Fixed domain unique ID and duplicate abort enforce the single-entry design.
  dependency-transparency:
    status: exempt
    comment: No additional Python requirements.
  docs-conditions:
    status: exempt
    comment: No integration-specific conditions.
  docs-triggers:
    status: exempt
    comment: No integration-specific triggers.
  devices:
    status: done
    comment: All entities are grouped under one PocketSmith service device per config entry.
  diagnostics:
    status: done
    comment: Diagnostics expose aggregate counts and allowlisted options; credentials, profiles, identifiers and financial values are excluded.
  discovery:
    status: exempt
    comment: PocketSmith is a cloud service with no discoverable local endpoint.
  discovery-update-info:
    status: exempt
    comment: No local network discovery or address information exists for this service.
  docs-data-update:
    status: done
    comment: README documents hourly coordinated polling and manual refresh.
  docs-examples:
    status: done
    comment: README includes automation examples for balances, budgets, and notifications.
  docs-known-limitations:
    status: done
    comment: README documents read-only access, polling, backfill duration, and API limits.
  docs-supported-devices:
    status: exempt
    comment: This integration does not integrate physical devices.
  docs-supported-functions:
    status: done
    comment: README lists supported entities, actions, controls, and read-only scope.
  docs-troubleshooting:
    status: done
    comment: README includes authentication, permissions, API availability, and backfill guidance.
  docs-use-cases:
    status: done
    comment: README provides balance, budget, categorisation, and net-worth automation examples.
  dynamic-devices:
    status: exempt
    comment: One static service device is managed per config entry; account data are entities.
  entity-category:
    status: done
    comment: Diagnostic, configuration, and primary entities use appropriate categories.
  entity-device-class:
    status: done
    comment: Monetary and problem entities declare device classes where applicable.
  entity-disabled-by-default:
    status: done
    comment: Less commonly used diagnostic entities are disabled by default.
  entity-translations:
    status: done
    comment: Entity names use translation keys; dynamic account and rollup names use placeholders, while category names are user-defined.
  exception-translations:
    status: done
    comment: Service action errors use translated exception keys.
  icon-translations:
    status: done
    comment: Custom entity icons are defined through icons.json, including state-dependent binary sensor icons.
  reconfiguration-flow:
    status: todo
    comment: >-
      The UI replaces and validates API keys, but does not verify that a replacement key belongs to the same PocketSmith account.
  repair-issues:
    status: done
    comment: Uncategorised data and failed backfill create translated repair issues.
  stale-devices:
    status: exempt
    comment: The single service device follows the config entry lifecycle.
